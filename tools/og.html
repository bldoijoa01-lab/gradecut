<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 카톡·SNS 링크 미리보기 이미지(og.png, 1200×630)와 앱 아이콘을 만드는 틀. tools/make_assets.js가 이 파일을 찍어서 만듦 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&family=IBM+Plex+Mono:wght@600&display=swap">
<style>
body{margin:0;font-family:"IBM Plex Sans KR",sans-serif}
.og{width:1200px;height:630px;box-sizing:border-box;padding:70px 80px;display:flex;flex-direction:column;justify-content:space-between;color:#1b2230;
  background:radial-gradient(700px 420px at 0% 0%,rgba(212,61,99,.22),transparent 65%),radial-gradient(700px 420px at 100% 0%,rgba(138,79,209,.2),transparent 65%),#f5f6f8}
.tag{align-self:flex-start;font-size:30px;font-weight:700;color:#fff;background:#d43d63;padding:8px 22px;border-radius:999px}
h1{margin:18px 0 0;font-size:104px;line-height:1.05;letter-spacing:-2px}
h1 span{background:linear-gradient(90deg,#d43d63,#8a4fd1);-webkit-background-clip:text;color:transparent}
p{margin:22px 0 0;font-size:38px;color:#475067;font-weight:500}
.row{display:flex;gap:18px}
.chip{font-size:30px;font-weight:700;padding:14px 26px;border-radius:20px;background:#fff;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.chip b{font-family:"IBM Plex Mono",monospace;color:#d43d63}
.icon{width:512px;height:512px;border-radius:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#d43d63,#8a4fd1)}
.icon b{font-family:"IBM Plex Mono",monospace;font-size:330px;color:#fff;line-height:1;margin-top:-20px}
</style></head><body>
<div class="og" id="og">
  <div><span class="tag">오송고 2학년을 위한</span><h1>등급컷 <span>아카이브</span></h1><p>과목별 등급컷 · 내 예상 등급과 확률 · 기말 목표 계산기</p></div>
  <div class="row"><span class="chip">1등급일 확률 <b>94%</b></span><span class="chip">학기말 목표 <b>기말 33등</b></span><span class="chip">정확도 <b>83</b></span></div>
</div>
<div class="icon" id="icon"><b>1</b></div>
</body></html>
