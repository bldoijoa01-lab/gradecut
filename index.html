<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>등급컷 아카이브</title>
<meta name="description" content="2학년 과목별 등급컷과 내 예상 등급 계산">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d43d63'/%3E%3Ctext x='16' y='23' font-size='19' font-family='monospace' font-weight='700' text-anchor='middle' fill='white'%3E1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column, OMR-sheet feel — exam chips, then a ruled table where each subject gets a 0–100 strip with its cut lines */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1b2230; --muted:#667085; --rule:#dfe3ea;
  --omr:#d43d63; --omr-soft:#fbe7ec; --me:#2f6fd6;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1a1f27; --ink:#e6e9ef; --muted:#9aa3b2; --rule:#2c3340;
  --omr:#f06b8b; --omr-soft:#3a1f28; --me:#6fa1ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1a1f27; --ink:#e6e9ef; --muted:#9aa3b2; --rule:#2c3340;
  --omr:#f06b8b; --omr-soft:#3a1f28; --me:#6fa1ff; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:4px}
h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1 span{color:var(--omr)}
.sub{color:var(--muted);font-size:.88rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.86rem;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--omr);border-color:var(--omr);color:#fff}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.summary{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sum-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.sum-avg small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.05em}
.sum-avg b{font-family:var(--mono);font-size:2.4rem;line-height:1.05;font-weight:600;color:var(--omr);font-variant-numeric:tabular-nums}
.sum-avg b span{font-size:.9rem;color:var(--muted);margin-left:4px;font-family:var(--sans);font-weight:500}
.sum-count{display:flex;gap:6px;flex-wrap:wrap}
.sum-count span{font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid var(--rule)}
.sum-count span.c1{background:var(--omr);border-color:var(--omr);color:#fff}
.sum-count span.c2{border-color:var(--omr);color:var(--omr)}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;min-width:0}
.tile .tg{grid-row:1/3;font-family:var(--mono);font-size:2rem;font-weight:600;line-height:1;width:1.3em;text-align:center;color:var(--muted)}
.tile .tn{font-weight:700;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .ts{font-size:.76rem;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.tile.g1{background:var(--omr-soft);border-color:transparent}
.tile.g1 .tg,.tile.g2 .tg{color:var(--omr)}
.tile.u .tg::after{content:"?";font-size:.45em;vertical-align:top}
.sheet{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:2px solid var(--omr)}
.sheet-head b{font-size:1rem}
.sheet-head small{color:var(--muted);font-size:.78rem;letter-spacing:.04em}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.subj{font-weight:700;font-size:1.05rem;min-width:0;display:flex;align-items:center;gap:14px}
.sname{display:flex;flex-direction:column;min-width:0}
.gb{flex:none;width:60px;height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--rule);color:var(--muted);box-sizing:border-box}
.gb b{font-family:var(--mono);font-size:1.95rem;line-height:1;font-weight:600}
.gb i{font-style:normal;font-weight:500;font-size:.62rem;letter-spacing:.05em;margin-top:3px}
.gb.g1{background:var(--omr);border-color:var(--omr);color:#fff}
.gb.g2{border-color:var(--omr);color:var(--omr)}
.gb.g3,.gb.g4,.gb.g5{border-color:var(--muted);color:var(--ink)}
.gb.part{border-style:dashed}
.gb.g1.part{background:var(--omr-soft);color:var(--omr)}
.gb.none b{font-size:1.4rem}
.subj small{font-weight:400;color:var(--muted);font-size:.78rem}
.acts{display:flex;gap:4px}
.icon{font:inherit;font-size:.78rem;background:none;border:1px solid transparent;color:var(--muted);padding:2px 8px;border-radius:6px;cursor:pointer}
.icon:hover{border-color:var(--rule);color:var(--ink)}
.icon.danger{color:var(--omr)}
.cuts{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr) 1.2fr;gap:6px}
.cell{display:flex;flex-direction:column;align-items:center;padding:6px 4px;border:1px solid var(--rule);border-radius:6px;min-width:0}
.cell i{font-style:normal;font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.cell b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:600}
.cell b.unsure{color:var(--muted);font-weight:500}
.cell b.unsure::after{content:"?";font-size:.75em;margin-left:1px;color:var(--omr)}
.cell b.none{color:var(--rule)}
.cell.me{background:var(--omr-soft);border-color:transparent}
.cell.me b{color:var(--me)}
.rkwrap{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin-top:3px}
.conf{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;cursor:help}
.conf::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;order:-1}
.conf.hi{color:#1e9a55;background:rgba(30,154,85,.13)}
.conf.mid{color:#c27a0b;background:rgba(194,122,11,.15)}
.conf.lo{color:#d6453b;background:rgba(214,69,59,.13)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.cell.me{flex-wrap:wrap}
.rk{font-size:.72rem;color:var(--me);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk small{font-size:.92em;font-weight:500;color:var(--muted)}
.rng{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rk.est{border-bottom:1px dotted var(--me)}
.strip{grid-column:1/-1;position:relative;height:22px;margin-top:2px}
.strip .base{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--rule);border-radius:2px}
.strip .tick{position:absolute;top:3px;width:2px;height:16px;background:var(--omr);transform:translateX(-1px)}
.strip .tick.unsure{background:none;border-left:2px dashed var(--omr)}
.strip .tick span{position:absolute;top:-1px;left:4px;font-size:.62rem;color:var(--omr);font-family:var(--mono)}
.strip .dot{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;background:var(--me);transform:translateX(-6px);box-shadow:0 0 0 3px var(--surface)}
.strip .scale{position:absolute;top:14px;font-size:.6rem;color:var(--muted);font-family:var(--mono)}
.facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:.76rem;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--rule)}
.dist{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;padding:10px 12px;background:var(--bg);border-radius:8px}
.dist-h{font-size:.72rem;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.drow{display:grid;grid-template-columns:4.6em 1fr 3.4em;align-items:center;gap:10px;font-size:.8rem}
.drow .r{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.drow .bar{height:10px;background:var(--rule);border-radius:3px;overflow:hidden}
.drow .bar i{display:block;height:100%;background:var(--omr);opacity:.8;border-radius:3px}
.drow .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.drow.mk .bar{height:0;background:none;border-top:2px dashed currentColor;border-radius:0}
.drow.mk .r,.drow.mk .n{color:inherit;font-weight:600}
.drow.mk.cut{color:var(--omr)}
.drow.mk.me{color:var(--me)}
.chart{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;padding:10px 12px 8px;background:var(--bg);border-radius:8px}
.chart-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.plot{position:relative;height:96px;display:flex;align-items:flex-end;border-bottom:1px solid var(--rule);margin-top:14px}
.plot .b{flex:1 1 0;min-width:0;align-self:stretch;display:flex;align-items:flex-end;padding:0 1px;box-sizing:border-box;cursor:pointer;border-radius:3px 3px 0 0;-webkit-tap-highlight-color:transparent}
.plot .b.sel{background:var(--rule)}
.plot .b i{display:block;width:100%;border-radius:2px 2px 0 0;background:var(--muted);opacity:.45}
.plot .b.g1 i{background:var(--omr)}
.plot .b.g2 i{background:var(--omr);opacity:.3}
.plot .b.k i{opacity:1}
.plot .b.g2.k i{opacity:.6}
.plot .b.me i{background:var(--me);opacity:.9}
.plot .cl{position:absolute;top:0;bottom:0;border-left:1.5px solid var(--omr);pointer-events:none}
.plot .cl.u{border-left-style:dashed}
.plot .cl span{position:absolute;top:-14px;left:-4px;font:600 .6rem var(--mono);color:var(--omr)}
.plot .ml{position:absolute;top:-4px;bottom:0;border-left:2px solid var(--me);pointer-events:none}
.plot .ml span{position:absolute;top:4px;left:3px;font:700 .62rem var(--sans);color:var(--me);white-space:nowrap;background:var(--bg);padding:0 3px;border-radius:3px}
.axis{position:relative;height:12px;font:500 .6rem var(--mono);color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%)}
.axis span:first-child{transform:none}
.axis span:last-child{transform:translateX(-100%)}
.chart-f{font-size:.7rem;color:var(--muted);margin:0}
.readout{font-size:.78rem;color:var(--ink);margin:0;min-height:1.5em;font-variant-numeric:tabular-nums}
.readout.idle{color:var(--muted)}
.chart details{font-size:.76rem;color:var(--muted)}
.chart summary{cursor:pointer}
.chart details .dist{padding:8px 0 0;background:none}
.goal{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.goal span{font-size:.78rem;padding:4px 10px;border-radius:8px;border:1px solid var(--me);color:var(--me);font-variant-numeric:tabular-nums}
.goal span b{font-family:var(--mono);font-weight:600}
.goal span.keep{border-color:var(--rule);color:var(--ink)}
.goal span small{color:var(--muted);font-size:.92em}
.chip.soon{border-style:dashed;color:var(--muted)}
.chip.soon em{font-style:normal;font-size:.68rem;font-weight:700;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--omr-soft);color:var(--omr)}
.chip.soon[aria-pressed="true"]{background:var(--surface);border-color:var(--omr);color:var(--ink)}
.soonbox{padding:40px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.soonbox b{font-family:var(--mono);font-size:1.3rem;letter-spacing:.12em;color:var(--omr)}
.soonbox p{margin:0;color:var(--muted);font-size:.88rem;max-width:30em;text-wrap:balance;word-break:keep-all}
.sem{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--rule);border-radius:10px}
.sem-h{font-size:.8rem;font-weight:700}
.sem-h small{font-weight:400;color:var(--muted);margin-left:6px}
.need{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.need span{display:block;font-size:.78rem;padding:6px 10px;border-radius:8px;border:1px solid var(--rule);font-variant-numeric:tabular-nums}
.need span em{display:block;font-style:normal;font-size:.68rem;font-weight:700;color:var(--muted)}
.need span.g1 em,.need span.g2 em{color:var(--omr)}
.need span b{font-family:var(--mono);font-weight:600}
.need span small{color:var(--muted)}
.need span small.sc{display:block;font-size:.7rem}
.hero{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:14px;border-radius:10px;background:var(--omr-soft)}
.hero h3{margin:0;font-size:1.05rem;color:var(--omr)}
.hero p{margin:0;font-size:.86rem;color:var(--ink);word-break:keep-all}
.sem-f{font-size:.72rem;color:var(--muted);margin:0}
.sp{display:flex;flex-direction:column;gap:6px}
.sp-h{margin:0;font-size:.84rem;color:var(--muted)}
.sp-h b{font-family:var(--mono);color:var(--ink)}
.sp-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.sp-big b{font-family:var(--mono);font-size:2.2rem;line-height:1.05;font-weight:600;color:var(--omr);font-variant-numeric:tabular-nums}
.sp-big span{font-size:.84rem;font-weight:700}
.sp-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--rule)}
.sp-bar i{display:block;height:100%}
.sp-bar .g1{background:var(--omr)}
.sp-bar .g2{background:var(--omr);opacity:.5}
.sp-bar .g3{background:var(--muted)}
.sp-bar .g4{background:var(--muted);opacity:.55}
.sp-bar .g5{background:var(--muted);opacity:.3}
.sp-leg{margin:0;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.76rem;font-variant-numeric:tabular-nums}
.sp-leg .g1,.sp-leg .g2{color:var(--omr);font-weight:700}
.semrange{width:100%;accent-color:var(--omr);margin:4px 0 0}
.semrange.rank{direction:rtl}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--omr);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.82rem;padding:6px 14px;border:0;background:var(--surface);color:var(--omr);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--omr);color:#fff;font-weight:700}
.rr{display:flex;justify-content:space-between;font:500 .64rem var(--mono);color:var(--muted);margin-top:-2px}
.sp-h small{font-size:.92em}
.needs summary{cursor:pointer;font-size:.78rem;color:var(--muted)}
.needs .need{margin-top:8px}
.rawme{margin:0;font-size:.84rem}
.rawme b{font-family:var(--mono);font-weight:600;color:var(--me)}
.rawme small{display:block;color:var(--muted);font-size:.72rem}
.semin{grid-column:1/-1;display:flex;gap:10px}
.semin label{flex:1;max-width:9em}
.sem-f.warn{color:var(--omr)}
.semin .myin{max-width:none}
.soonhead{padding:16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
.soonhead b{font-family:var(--mono);font-size:.95rem;letter-spacing:.12em;color:var(--omr)}
.soonhead p{margin:0;color:var(--muted);font-size:.84rem;word-break:keep-all}
.weaknote{grid-column:1/-1;margin:0;font-size:.76rem;color:#c27a0b}
.news{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.news-h{display:flex;align-items:center;gap:8px;font-size:.88rem}
.news-h .new{font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--omr);color:#fff}
.news ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.news li{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:8px;font-size:.84rem;min-width:0}
.news time{font:500 .72rem var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.news .t{min-width:0;overflow-wrap:anywhere}
.news .t em{font-style:normal;font-size:.62rem;font-weight:700;color:var(--omr);margin-left:6px;vertical-align:1px}
.tag{font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag.d{background:var(--omr-soft);color:var(--omr)}
.tag.f{background:rgba(47,111,214,.12);color:var(--me)}
.news-f{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.8rem}
.news-f a{color:var(--me);text-decoration:none;font-weight:600}
.news-f a.report{color:#fff;background:var(--omr);padding:4px 12px;border-radius:999px}
.note{grid-column:1/-1;font-size:.8rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.empty{padding:28px 16px;color:var(--muted);text-align:center;font-size:.9rem}
form{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
form h2{margin:0;font-size:1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.myin{font-family:var(--mono);font-weight:600;font-size:1.02rem;text-align:center;color:var(--me);background:var(--surface);border:1px dashed var(--me);padding:2px 4px;width:100%;max-width:5.5em}
.myin::placeholder{color:var(--muted);font-weight:500;font-size:.8rem}
.privacy{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--me);margin:4px 0 0}
.grid.g3{grid-template-columns:1fr 1fr 2fr}
label{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);letter-spacing:.03em;min-width:0}
input{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;min-width:0;width:100%;box-sizing:border-box}
.grid4 input{font-family:var(--mono);text-align:center}
.hint{font-size:.76rem;color:var(--muted);margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:.9rem;padding:8px 16px;border-radius:8px;border:0;background:var(--omr);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--rule);font-weight:500}
.foot{display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted)}
.foot p{margin:0}
.status{font-size:.8rem;color:var(--muted);min-height:1.2em;margin:0}
@media (max-width:520px){
  .grid,.grid.g3{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .cuts{grid-template-columns:repeat(4,1fr)}
  .cell.me{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px}
}
[hidden]{display:none!important}
.picker{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.picker h2{margin:0;font-size:.95rem}
.picker h2 small{font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px}
.picker .row2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.picker .mine{font-size:.86rem;min-width:0}
.picker .mine b{color:var(--omr)}
.pchip{font:inherit;font-size:.84rem;padding:6px 12px;border-radius:999px;border:1px dashed var(--muted);background:none;color:var(--ink);cursor:pointer}
.pchip[aria-pressed="true"]{border-style:solid;border-color:var(--omr);background:var(--omr-soft);color:var(--omr);font-weight:700}
.pchip:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.pnote{font-size:.76rem;color:var(--muted);margin:0}
.nocut{grid-column:span 4;display:flex;align-items:center;justify-content:center;padding:10px;border:1px dashed var(--rule);border-radius:6px;color:var(--muted);font-size:.84rem}
.asof{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--rule);color:var(--ink);margin:6px 0 0;font-variant-numeric:tabular-nums}
.asof::before{content:"";width:7px;height:7px;border-radius:50%;background:#2fb36b}
.rowat{grid-column:1/-1;font-size:.72rem;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
[data-tip]{position:relative;cursor:help}
[data-tip]:focus{outline:none}
[data-tip]:focus-visible{outline:2px solid var(--me);outline-offset:2px}
[data-tip]:hover::before,[data-tip]:focus::before{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:0;width:max-content;max-width:220px;white-space:pre-line;background:var(--ink);color:var(--bg);font:500 .72rem/1.45 var(--sans);letter-spacing:0;text-align:left;padding:7px 10px;border-radius:7px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}
[data-tip].tr:hover::before,[data-tip].tr:focus::before{left:auto;right:0}
.cell b.unsure{text-decoration:underline dotted var(--omr);text-underline-offset:3px}
.sheet{overflow:visible}
.alias{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:4px}
@media (prefers-reduced-motion:no-preference){.chip,.icon{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>등급컷 <span>아카이브</span></h1>
    <p class="sub">2학년 · 5등급제 기준 · 1컷 상위 10% · 2컷 34% · 3컷 66% · 4컷 90%</p>
    <p class="asof" id="asof">등급컷 불러오는 중</p>
    <p class="privacy">각 과목의 '내 점수' 칸에 점수를 입력하면 내 등급과 평균이 계산돼요. 점수는 이 기기의 브라우저에만 저장되고, 아무에게도 전송되지 않아요.</p>
  </header>

  <section class="news" id="news" aria-label="최근 업데이트" hidden></section>

  <div class="chips" id="chips" role="group" aria-label="시험 선택"></div>

  <section class="picker" id="picker" aria-label="내 선택과목"></section>

  <section class="summary" id="summary" hidden></section>

  <section class="sheet" aria-live="polite">
    <div class="sheet-head"><b id="examTitle">불러오는 중…</b><small id="count"></small></div>
    <div id="rows"><div class="empty">등급컷을 불러오는 중이에요.</div></div>
  </section>

  <footer class="foot">
    <p class="status" id="status"></p>
    <p><span id="updated"></span> · 컷 옆 ?는 추정치, ↑는 '이상'이라는 뜻이에요.</p>
    <p class="legend">석차 신뢰도는 90% 범위가 얼마나 좁은지로 정해요 <span class="conf hi">높음</span> 범위 폭이 응시 인원의 6% 이하 <span class="conf mid">중간</span> 12% 이하 <span class="conf lo">낮음</span> 그보다 넓음</p>
    <p id="validation"></p>
    <p><button class="icon" type="button" id="clear">내 점수 모두 지우기</button><span id="clearAsk" hidden> 정말 지울까요? <button class="icon danger" type="button" id="clearYes">지우기</button><button class="icon" type="button" id="clearNo">취소</button></span></p>
  </footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const LKEY = "gradecut-my-scores";
  let docs = [], current = null, scores = {}, renderWaiting = false, sel = null, picking = false;
  const SKEY = "gradecut-my-electives";
  // 정보가 적은 과목(weak)은 추정 컷·석차·분포를 기본으로 숨기고, '추정 컷 보기'를 누른 과목만 보여줌
  const EKEY = "gradecut-show-est";
  let semMode = (() => { try { return localStorage.getItem("gradecut-sem-mode") === "score" ? "score" : "rank"; } catch { return "rank"; } })();
  let showEst = (() => { try { const v = JSON.parse(localStorage.getItem(EKEY) || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } })();
  const saveEst = () => { try { localStorage.setItem(EKEY, JSON.stringify(showEst)); } catch {} };
  function viewOf(d) {
    if (!d.weak || showEst.includes(d.id)) return d;
    const v = { ...d, hiddenEst: true, c: (d.c || []).map(x => String(x).includes("?") ? "" : x) };
    for (const k of ["rx", "r05", "r50", "r95", "gp", "hist", "hist_lo", "hist_hi", "cut_ranges", "note"]) delete v[k];
    return v;
  }
  const loadSel = () => { try { const v = JSON.parse(localStorage.getItem(SKEY) || "null"); return Array.isArray(v) ? v : null; } catch { return null; } };
  const saveSel = () => { try { localStorage.setItem(SKEY, JSON.stringify(sel)); } catch {} };
  const MAXSEL = 5;
  const nameOf = d => esc(d.subject) + (d.alias ? `<span class="alias">${esc(d.alias)}</span>` : "");

  const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LKEY) || "{}"); } catch { return {}; } };
  const saveLocal = () => { try { localStorage.setItem(LKEY, JSON.stringify(scores)); return true; } catch { return false; } };

  const parse = v => {
    const s = String(v ?? "").trim();
    if (!s) return null;
    const unsure = s.includes("?");
    const n = parseFloat(s.replace(/[^\d.]/g, ""));
    return isNaN(n) ? null : { n, unsure, raw: s.replace("?", "") };
  };
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

  // 개인 고정 등급(g)이 '?'(거의 확정)인데 컷으로 등급이 확정되면 컷 계산을 우선
  const sureHit = d => { const m = parse(d.my); return d.sure && m && m.n >= d.sure; };
  function useG(d) {
    if (!d.g) return false;
    if (sureHit(d)) return false;
    if (!String(d.g).includes("?")) return true;
    const m = parse(d.my); const cuts = d.c || [];
    if (!m) return true;
    for (let i = 0; i < 4; i++) {
      const c = parse(cuts[i]);
      if (!c) return true;
      if (m.n >= c.n) return c.unsure;
    }
    return false;
  }

  // 시뮬레이션 표(rx 점수 격자마다 등수 5%/50%/95%, 등급 확률 %)에서 x점 값을 보간
  function simAt(d, x) {
    const X = d.rx;
    if (!Array.isArray(X) || !Array.isArray(d.r50) || X.length < 2) return null;
    x = Math.max(X[0], Math.min(X[X.length - 1], x));
    let a = 0, b = X.length - 1;
    while (b - a > 1) { const c = (a + b) >> 1; if (X[c] <= x) a = c; else b = c; }
    const t = X[b] > X[a] ? (x - X[a]) / (X[b] - X[a]) : 0;
    const L = arr => arr[a] * (1 - t) + arr[b] * t;
    const gp = Array.isArray(d.gp) ? [0, 1, 2, 3, 4].map(k => d.gp[a][k] * (1 - t) + d.gp[b][k] * t) : null;
    return { lo: Math.round(L(d.r05)), mid: Math.round(L(d.r50)), hi: Math.round(L(d.r95)), gp };
  }
  function gradeProbText(gp) {
    const items = gp.map((p, k) => [k + 1, Math.round(p)]).filter(([, p]) => p >= 1);
    if (items.length === 1 || items.some(([, p]) => p >= 99)) {
      const top = items.reduce((a, b) => (b[1] > a[1] ? b : a));
      return `등급: ${top[0]}등급 (확률 99% 이상)`;
    }
    return "등급 확률: " + items.map(([g, p]) => `${g}등급 ${p}%`).join(" · ");
  }

  // 등급 판단: 확정 컷 → (불확실하면) 시뮬레이션 확률 → 개인 고정값 → 추정 컷
  function gradeInfo(d) {
    const m = parse(d.my); if (!m) return null;
    if (sureHit(d)) return { n: 1, u: false, tip: `${d.sure}점 이상은 석차상 1등급 안에 들어서 확정이에요.` };
    const cuts = d.c || [];
    let det = null;
    for (let i = 0; i < 4; i++) {
      const c = parse(cuts[i]);
      if (!c) { det = i === 0 ? null : { n: i + 1, u: true, below: true }; break; }
      if (m.n >= c.n) { det = { n: i + 1, u: c.unsure }; break; }
      if (i === 3) det = { n: 5, u: false };
    }
    if (det && !det.u) return det;
    const s = simAt(d, m.n);
    if (s && s.gp) {
      let best = 0;
      s.gp.forEach((p, k) => { if (p > s.gp[best]) best = k; });
      const pmax = Math.round(s.gp[best]);
      return { n: best + 1, u: pmax < 95, prob: true, pmax, tip: gradeProbText(s.gp) + (pmax < 95 ? "\n추정 컷 근처라 등급이 바뀔 수 있어요." : "") };
    }
    if (useG(d)) { const g = String(d.g); return { n: parseInt(g), u: g.includes("?"), tip: "공식 컷은 아직 없지만, 점수로 보면 거의 확실한 등급이에요." }; }
    if (det) return { ...det, tip: det.below ? "아랫 컷이 아직 없어서 몇 등급 이하인지까지만 알 수 있어요." : "추정한 컷 기준이라 실제 컷이 나오면 바뀔 수 있어요." };
    return null;
  }
  const gradeNum = d => gradeInfo(d);

  function summaryHtml(rows) {
    const items = rows.map(d => ({ d, g: gradeNum(d), m: parse(d.my) })).filter(x => x.m);
    if (!items.length) return "";
    const graded = items.filter(x => x.g);
    const avg = graded.length ? (graded.reduce((s, x) => s + x.g.n, 0) / graded.length).toFixed(2) : "—";
    const crOf = x => parseFloat(x.d.cr) || 0;
    const totalCr = graded.reduce((s, x) => s + crOf(x), 0);
    const wavg = graded.length && graded.every(x => crOf(x) > 0)
      ? (graded.reduce((s, x) => s + x.g.n * crOf(x), 0) / totalCr).toFixed(2) : null;
    const counts = {}; graded.forEach(x => counts[x.g.n] = (counts[x.g.n] || 0) + 1);
    items.sort((a, b) => (a.g?.n ?? 9) - (b.g?.n ?? 9) || b.m.n - a.m.n);
    const tiles = items.map(({ d, g, m }) => {
      const c1 = parse((d.c || [])[0]);
      const gap = c1 && !(d.c?.[0] || "").includes("↑") ? (m.n - c1.n) : null;
      const gapTxt = gap === null ? "" : ` · 1컷 ${gap >= 0 ? "+" : "−"}${Math.abs(gap).toFixed(1).replace(/\.0$/, "")}`;
      return `<div class="tile ${g ? "g" + g.n : ""}${g?.u ? " u" : ""}"${g?.u && g.tip ? ` tabindex="0" data-tip="${esc(g.tip)}"` : ""}><span class="tg">${g ? g.n : "?"}</span><span class="tn">${esc(d.alias || d.subject)}</span><span class="ts">${esc(m.raw)}점${gapTxt}</span></div>`;
    }).join("");
    const chips = Object.keys(counts).sort().map(k => `<span class="c${k}">${k}등급 ${counts[k]}과목</span>`).join("");
    return `<div class="sum-head"><div class="sum-avg">${wavg
      ? `<small>내 평균 등급 · 학점 가중</small><b>${wavg}<span>${graded.length}과목 · ${totalCr}학점 · 단순 평균 ${avg}</span></b>`
      : `<small>내 평균 등급 · 단순 평균</small><b>${avg}<span>${graded.length}과목</span></b>`}</div><div class="sum-count">${chips}</div></div><div class="sum-grid">${tiles}</div>`;
  }

  function badge(d) {
    const m = parse(d.my);
    if (!m) return `<div class="gb none"><b>—</b><i>점수 입력</i></div>`;
    const g = gradeInfo(d);
    if (!g) return `<div class="gb none"><b>?</b><i>컷 대기</i></div>`;
    const sub = g.below ? "등급 이하" : g.prob && g.u ? `확률 ${g.pmax}%` : g.u ? "등급?" : "등급";
    return `<div class="gb g${g.n}${g.u ? " part" : ""}"${g.tip ? ` tabindex="0" data-tip="${esc(g.tip)}"` : ""}><b>${g.n}${g.below ? "↓" : ""}</b><i>${sub}</i></div>`;
  }

  // 석차 추정: 컷(상위 10/34/66/90%)과 알려진 인원(anchors: [점수, 그 점수 이상 인원])을 이어 직선 보간
  function rankOf(d) {
    const m = parse(d.my); if (!m) return null;
    const N = parseFloat(d.n) || 0;
    const s = N ? simAt(d, m.n) : null;
    if (s) return { sim: true, rank: Math.max(1, s.mid), lo: Math.max(1, s.lo), hi: Math.min(N, s.hi), N, frac: s.mid / N, gp: s.gp };
    // 분포 모델 표: tab[점수] = 그 점수 이상인 사람 비율 (평균·컷·점수대 인원에 맞춰 미리 계산)
    if (Array.isArray(d.tab) && d.tab.length === 101) {
      const x = Math.max(0, Math.min(100, m.n));
      if (d.tab_min && x < d.tab_min) return { below: true, frac: d.tab[Math.round(d.tab_min)], N, model: true };
      const lo = Math.floor(x), hi = Math.min(100, lo + 1), t = x - lo;
      const frac = d.tab[lo] * (1 - t) + d.tab[hi] * t;
      return { frac, N, model: true, conf: d.rk_conf, rank: N ? Math.max(1, Math.round(frac * N)) : null };
    }
    const pts = [[100, 0]];
    const fr = [0.10, 0.34, 0.66, 0.90];
    let est = false, lowest = null;
    (d.c || []).forEach((v, i) => { const p = parse(v); if (p) { pts.push([p.n, fr[i]]); if (p.unsure) est = true; lowest = i; } });
    if (N) (d.anchors || []).forEach(([sc, cnt]) => pts.push([sc, cnt / N]));
    if (pts.length < 2) return null;
    if (lowest === 3) pts.push([0, 1]);
    pts.sort((a, b) => b[0] - a[0]);
    for (let i = 1; i < pts.length; i++) pts[i][1] = Math.max(pts[i][1], pts[i - 1][1]);
    const last = pts[pts.length - 1];
    if (m.n < last[0]) return { below: true, frac: last[1], N, est };
    let frac = 0;
    for (let i = 1; i < pts.length; i++) {
      const [s1, f1] = pts[i - 1], [s2, f2] = pts[i];
      if (m.n <= s1 && m.n >= s2) { frac = s1 === s2 ? f2 : f1 + (s1 - m.n) / (s1 - s2) * (f2 - f1); break; }
    }
    return { frac, N, est, rank: N ? Math.max(1, Math.round(frac * N)) : null };
  }
  // 신뢰도 = 90% 범위 폭 ÷ 응시 인원 (아래 기준은 범례와 같음)
  const CONF_HI = 0.06, CONF_MID = 0.12;
  function rankHtml(d) {
    const r = rankOf(d); if (!r) return "";
    const pct = Math.max(0.1, r.frac * 100);
    const pctTxt = pct < 10 ? pct.toFixed(1) : Math.round(pct);
    if (r.sim) {
      const w = (r.hi - r.lo) / r.N;
      const [lv, cls] = w <= CONF_HI ? ["높음", "hi"] : w <= CONF_MID ? ["중간", "mid"] : ["낮음", "lo"];
      const tip = [
        `추정 석차 · 신뢰도 ${lv}`,
        r.lo === r.hi ? `${r.lo}등 확정 (같은 점수인 사람과는 공동 ${r.lo}등)` : `90% 범위: ${r.lo}~${r.hi}등 (10번 중 9번은 이 안)`,
        `범위 폭: 전체 ${r.N}명의 ${Math.round(w * 100)}%`,
        r.gp ? gradeProbText(r.gp) : "",
        `계산: 사실과 맞는 분포 ${d.rk_models || "여러"}개 × 가상의 반 ${d.rk_sims || 40}개`,
        d.rk_why ? "근거: " + d.rk_why : ""
      ].filter(Boolean).join("\n");
      return `<span class="rkwrap"><span class="rk">${r.lo === r.hi ? "" : "약 "}${r.rank}등<small>/${r.N}</small> · 상위 ${pctTxt}%</span><span class="rng">${r.lo === r.hi ? "" : r.lo + "~" + r.hi + "등"}</span><span class="conf ${cls} tr" tabindex="0" data-tip="${esc(tip)}">${lv}</span></span>`;
    }
    const m = parse(d.my);
    let lv = d.rk_conf || (r.est ? "낮음" : "중간");
    if (d.rk_low_below && m && m.n < d.rk_low_below) lv = "낮음";
    if (r.below) lv = "낮음";
    const LV = { "높음": ["hi", "±2~3등"], "중간": ["mid", "±5등 안팎"], "낮음": ["lo", "±10등 이상"] }[lv] || ["mid", "±5등 안팎"];
    const tip = [
      `추정 석차 · 신뢰도 ${lv}`,
      `오차: ${r.N ? LV[1] : "몇 %p"} 정도`,
      r.model ? "방법: 평균·컷·점수대 인원에 맞춘 분포 모델" : "방법: 컷 사이를 직선으로 이음",
      d.rk_why ? "근거: " + d.rk_why : ""
    ].filter(Boolean).join("\n");
    const txt = r.below ? `상위 ${Math.round(r.frac * 100)}% 밖`
      : r.rank ? `약 ${r.rank}등/${r.N} · 상위 ${pctTxt}%` : `상위 약 ${pctTxt}%`;
    return `<span class="rkwrap"><span class="rk">${txt}</span><span class="conf ${LV[0]} tr" tabindex="0" data-tip="${esc(tip)}">${lv}</span></span>`;
  }

  const num = n => String(Math.round(n * 10) / 10);

  // 5점 구간별 인원: 계산기가 저장한 구간 인원(hist: 분포들의 평균, hist_lo/hi: 90% 범위)을 쓰고,
  // 없으면 시뮬레이션 등수 중앙값(r50)으로 'x점 이상 인원'을 구해 구간마다 뺀다
  // 알려진 점수대 인원(dist)과 구간이 정확히 같으면 그 실제 인원을 쓴다
  function binsOf(d) {
    const N = parseFloat(d.n) || 0;
    const known = {};
    (d.dist || []).forEach(x => { const [a, b] = String(x.r).split("~").map(parseFloat); if (b - a === 5) known[a] = x.n; });
    if (Array.isArray(d.hist) && d.hist.length === 20) return d.hist.map((h, i) => {
      const lo = i * 5;
      return lo in known ? { lo, n: known[lo], h: known[lo], k: true } : { lo, n: Math.round(h), h, k: false, band: [Math.round(d.hist_lo[i]), Math.round(d.hist_hi[i])] };
    });
    if (!N || !Array.isArray(d.rx)) return null;
    // 등수 r → 'x점 이상 인원' r-1 (맨 아래 등수 N은 전원으로 봄)
    const cnt = r => r >= N ? N : Math.max(0, r - 1);
    const ge = (x, k = "mid") => x <= 0 ? N : cnt(simAt(d, x - 0.01)[k]);
    const bins = [];
    for (let i = 0; i < 20; i++) {
      const lo = i * 5;
      const est = Math.max(0, ge(lo) - (i === 19 ? 0 : ge(lo + 5)));
      // 이 점수 이상 인원의 90% 범위 (가상의 반 시뮬레이션의 5%·95% 등수)
      const range = lo > 0 ? [ge(lo, "lo"), ge(lo), ge(lo, "hi")] : null;
      bins.push(lo in known ? { lo, n: known[lo], k: true, range } : { lo, n: Math.round(est), k: false, range });
    }
    return bins;
  }

  function chartHtml(d) {
    const bins = binsOf(d);
    if (!bins) return d.dist?.length ? distHtml(d) : "";
    const cuts = [0, 1, 2, 3].map(i => parse((d.c || [])[i]));

    return `<div class="sp"><p class="sp-h">${guessed ? "기말도 중간과 같은 " : "기말 "}<b>${num(fx)}</b>점이면</p>
      ${gpBlock(r.gp)}
      <p class="rawme">학기말 원점수 <b>${num(r.raw)}</b>점 <small>참고용 · 중간 ${esc(r.m.raw)}×25% + 기말 ${num(fx)}×25% + 수행 ${num(r.perf)}</small></p></div>`;
  }
  function semHtml(mid, fin, fstr, note = true, pstr = "", slider = false, rstr = "") {
    const s = semInfo(mid, fin, fstr, pstr);
    if (!s.M) return `<div class="sem"><p class="sem-f">${mid.hiddenEst ? "정보가 적은 과목이라, 중간 탭에서 이 과목의 '추정 컷 보기'를 켜면 계산돼요." : "중간 분포 정보가 아직 없어서 학기말 등급을 계산할 수 없어요."}</p></div>`;
    if (!s.m) return `<div class="sem"><p class="sem-f">중간 점수를 넣으면 학기말 등급 확률이 나와요.</p></div>`;
    // 기말 전(slider): 목표 등수로. 비어 있으면 '기말도 중간과 비슷한 등수'로 먼저 보여줌 (저장은 안 함)
    // 기말 데이터가 있으면: 실제 기말 점수로
    let center, range = "";
    if (slider && semMode === "score") {
      const f0 = parse(fstr), guessed = !f0, fx = Math.max(0, Math.min(100, f0 ? f0.n : s.m.n));
      center = probHtml(mid, fin, fx, guessed, pstr);
      range = `<input type="range" class="semrange" min="0" max="100" step="0.5" value="${fx}" data-mid="${esc(mid.id)}" data-mode="score" aria-label="${esc(mid.subject)} 기말 목표 점수"><div class="rr" aria-hidden="true"><span>0점</span><span>100점</span></div>`;
    } else if (slider) {
      const N = s.M.N, r0 = parse(rstr), guessed = !r0;
      const rr = Math.max(1, Math.min(N, Math.round(r0 ? r0.n : s.M.above(s.m.n))));
      center = probRankHtml(mid, fin, rr, guessed, pstr);
      range = `<input type="range" class="semrange rank" min="1" max="${N}" step="1" value="${rr}" data-mid="${esc(mid.id)}" data-mode="rank" aria-label="${esc(mid.subject)} 기말 목표 등수"><div class="rr" aria-hidden="true"><span>${N}등</span><span>1등</span></div>`;
    } else center = s.f ? probHtml(mid, fin, Math.max(0, Math.min(100, s.f.n)), false, pstr) : `<p class="sem-f">기말 점수를 넣으면 학기말 등급 확률이 나와요.</p>`;
    const scoreTxt = x => !x.sr ? `점수로는 ${x.from}점 이상`
      : `점수로는 ${x.from}점 이상 · 기말 난이도·퍼짐 따라 ${x.sr[0] ?? 0}~${x.sr[1] ?? 100}${x.sr[1] === null ? "점↑" : "점"}`;
    const need = s.need.map(x => `<span class="g${x.g + 1}"><em>${x.g + 1}등급</em>${x.from === 0 ? "기말 몇 등이든 유력"
      : x.from === null ? `기말 만점이어도 어려움 <small>(${x.best}%)</small>`
      : `기말 <b>약 ${x.rank}등</b> 안${x.rlo !== x.rhi ? ` <small>(${x.rlo}~${x.rhi}등)</small>` : ""}<small class="sc">${scoreTxt(x)}</small>`}</span>`).join("");
    return `<div class="sem"><div class="sem-h">학기말 등급 확률 <small>중간 ${esc(s.m.raw)}점 · ${s.p ? `수행 ${esc(s.p.raw)}점 기준` : "수행 만점으로 계산"}</small></div>
      ${s.pBad ? `<p class="sem-f warn">수행 점수는 50점 만점 기준으로 넣어 주세요. 지금은 만점으로 계산했어요.</p>` : ""}${range}${center}
      <details class="needs"><summary>등급별로 기말 몇 등·몇 점이 필요한지 보기</summary><div class="need">${need}</div></details>
      ${note ? `<p class="sem-f">${semNote(fin)}</p>` : ""}</div>`;
  }
  const semKey = mid => "sem-" + mid.id;
  const perfKey = mid => "perf-" + mid.id;
  const semrKey = mid => "semr-" + mid.id;     // 기말 목표 등수
  const perfIn = mid => `<label>수행 (50점)<input class="myin" data-score="${esc(perfKey(mid))}" inputmode="decimal" placeholder="50" value="${esc(scores[perfKey(mid)]?.my || "")}"></label>`;
  // 기말 데이터가 들어온 뒤: 기말 과목 행마다 같은 과목 중간 점수와 합쳐 학기말 예상
  function semRow(fin) {
    const midExam = PAIR[fin.exam]; if (!midExam) return "";
    const mid = docs.find(x => x.exam === midExam && x.subject === fin.subject); if (!mid) return "";
    return `<div class="semin">${perfIn(mid)}</div>` + semHtml({ ...mid, my: scores[mid.id]?.my || "" }, fin, fin.my, true, scores[perfKey(mid)]?.my || "");
  }

  const exams = () => [...new Set(docs.map(d => d.exam))].sort().reverse();
  // 아직 컷이 없는 다가오는 시험: 칩만 보여주고 '준비 중' 안내 (cuts.json에 과목이 생기면 자동으로 일반 시험이 됨)
  const UPCOMING = ["2026 2학기 기말"];

  function render() {
    if (document.activeElement?.classList.contains("myin")) { renderWaiting = true; return; }
    renderWaiting = false;
    const list = exams();
    const soon = UPCOMING.filter(e => !list.includes(e));
    if (!current || !(list.includes(current) || soon.includes(current))) current = list[0] || null;
    $("chips").innerHTML = list.map(e =>
      `<button class="chip" type="button" data-exam="${esc(e)}" aria-pressed="${e === current}">${esc(e)}</button>`).join("")
      + soon.map(e => `<button class="chip soon" type="button" data-exam="${esc(e)}" aria-pressed="${e === current}">${esc(e)}<em>준비 중</em></button>`).join("");
    const isSoon = soon.includes(current);
    const base = isSoon ? PAIR[current] : current;     // 준비 중인 기말 탭: 과목 목록은 같은 학기 중간에서
    $("picker").hidden = isSoon && !base;
    if (isSoon && !base) {
      $("summary").hidden = true;
      $("examTitle").textContent = current;
      $("count").textContent = "준비 중";
      $("rows").innerHTML = `<div class="soonbox"><b>COMING SOON</b><p>${esc(current)} 등급컷은 시험이 끝나고 컷이 나오는 대로 여기에 올라와요.</p><p>중간고사처럼 과목별 컷, 내 등급, 석차 계산을 그대로 쓸 수 있어요.</p></div>`;
      return;
    }
    if (!current) { $("examTitle").textContent = "아직 등급컷이 없어요"; $("rows").innerHTML = ""; return; }
    const examDocs = docs.filter(d => d.exam === base);
    const electives = examDocs.filter(d => !d.common).sort((a, b) => a.subject.localeCompare(b.subject, "ko"));
    const showPick = picking || !sel;
    const chosen = sel || [];
    $("picker").innerHTML = showPick
      ? `<h2>내 선택과목 고르기<small>공통(국어·영어·미적분I)은 자동 포함 · 최대 ${MAXSEL}개</small></h2>
         <div class="chips">${electives.map(d => `<button class="pchip" type="button" data-pick="${esc(d.subject)}" aria-pressed="${chosen.includes(d.subject)}">${esc(d.subject)}${d.alias ? ` (${esc(d.alias)})` : ""}</button>`).join("")}</div>
         <div class="row2"><p class="pnote">${chosen.length}개 선택됨 · 고른 과목만 아래 목록과 평균에 들어가요.</p><button class="btn" type="button" id="pickDone">완료</button></div>`
      : `<div class="row2"><div class="mine">선택과목 <b>${chosen.length}</b> · ${chosen.map(esc).join(" · ") || "없음"}</div><button class="icon" type="button" id="pickEdit">바꾸기</button></div>`;
    const rows = examDocs.filter(d => d.common || chosen.includes(d.subject))
      .sort((a, b) => (b.common ? 1 : 0) - (a.common ? 1 : 0) || a.subject.localeCompare(b.subject, "ko"))
      .map(d => viewOf({ ...d, my: scores[d.id]?.my || "", g: scores[d.id]?.g || "" }));
    if (isSoon) {
      $("summary").hidden = true;
      $("examTitle").textContent = current + " · 기말 목표 계산기";
      $("count").textContent = "기말 컷 준비 중";
      $("rows").innerHTML = `<div class="soonhead"><b>COMING SOON</b><p>${esc(current)} 등급컷은 시험이 끝나고 컷이 나오는 대로 올라와요.</p>
          <div class="hero"><h3>기말 목표 계산기</h3><p>중간 점수를 넣고 기말 목표를 정하면, 학기말 1등급 확률을 바로 알려드려요. 막대를 움직이면서 기말에서 얼마나 해야 하는지 감을 잡아 보세요.</p>
          <div class="seg" role="group" aria-label="기말 목표 정하는 방법"><button type="button" data-semmode="rank" aria-pressed="${semMode === "rank"}">목표 등수로</button><button type="button" data-semmode="score" aria-pressed="${semMode === "score"}">목표 점수로</button></div>
          <p class="sem-f">${semMode === "rank" ? "등수로 정하면 기말이 쉽든 어렵든 같은 자리라서 확률이 더 정확해요." : "점수로 정하면 기말이 쉬운지 어려운지에 따라 같은 점수도 자리가 달라져서, 그만큼 확률이 덜 확실해요."}</p>
          <p>기말 난이도, 점수가 퍼진 정도, 중간을 잘 본 사람이 기말도 잘 보는 정도처럼 아직 모르는 건 여러 경우를 확률에 다 섞어 넣었어요. 학기말 = 중간 25% + 기말 25% + 수행 50%.</p><p class="sem-f">${semNote(null)}</p></div></div>`
        + rows.map(d => {
          const midIn = `<label>중간 점수<input class="myin" data-score="${esc(d.id)}" inputmode="decimal" placeholder="입력" value="${esc(d.my)}"></label>`;
          const fk = semMode === "rank" ? semrKey(d) : semKey(d);
          const finIn = `<label>${semMode === "rank" ? "기말 목표 등수" : "기말 목표 점수"}<input class="myin" data-score="${esc(fk)}" inputmode="${semMode === "rank" ? "numeric" : "decimal"}" placeholder="${semMode === "rank" ? "예: 20" : "입력"}" value="${esc(scores[fk]?.my || "")}"></label>`;
          return `<div class="row"><div class="subj"><div class="sname"><span>${nameOf(d)}</span><small>${d.cr ? d.cr + "학점" : ""}</small></div></div><div class="semin">${midIn}${finIn}${perfIn(d)}</div>${semHtml(d, null, scores[semKey(d)]?.my || "", false, scores[perfKey(d)]?.my || "", true, scores[semrKey(d)]?.my || "")}</div>`;
        }).join("");
      return;
    }
    const sum = summaryHtml(rows);
    $("summary").innerHTML = sum;
    $("summary").hidden = !sum;
    $("examTitle").textContent = current;
    $("count").textContent = rows.length + "과목";
    $("rows").innerHTML = rows.map(d => {
      const cuts = d.c || [];
      const noCut = !cuts.some(v => String(v || "").trim());
      const cells = noCut ? `<div class="nocut">아직 등급컷이 없어요</div>` : [0, 1, 2, 3].map(i => {
        const p = parse(cuts[i]);
        return `<div class="cell"><i>${i + 1}컷</i>${p ? (p.unsure
          ? `<b class="unsure${i >= 2 ? " tr" : ""}" tabindex="0" data-tip="${esc(d.cut_ranges && d.cut_ranges[i + 1]
              ? `추정 컷 · 아직 확정 아님\n90% 범위: ${d.cut_ranges[i + 1][0]}~${d.cut_ranges[i + 1][2]}점\n(10번 중 9번은 이 안)` + (d.rk_why ? "\n근거: " + d.rk_why : "")
              : "추정 컷 · 아직 확정 아님" + (d.note ? "\n" + d.note.replace(/ · /g, "\n").replace(/요\. /g, "요.\n").replace(/ \(([^)]*?)\s*범위\)/, "\n범위: $1") : ""))}">${esc(p.raw)}</b>`
          : `<b>${esc(p.raw)}</b>`) : `<b class="none">—</b>`}</div>`;
      }).join("");
      const myP = parse(d.my);
      const me = `<div class="cell me"><i>내 점수</i><input class="myin" id="my-${esc(d.id)}" data-score="${esc(d.id)}" inputmode="decimal" placeholder="입력" aria-label="${esc(d.subject)} 내 점수" value="${esc(d.my)}">${rankHtml(d)}</div>`;
      const ticks = [0, 1, 2, 3].map(i => {
        const p = parse(cuts[i]); if (!p) return "";
        return `<div class="tick ${p.unsure ? "unsure" : ""}" style="left:${Math.max(0, Math.min(100, p.n))}%"><span>${i + 1}</span></div>`;
      }).join("");
      const dot = myP ? `<div class="dot" style="left:${Math.max(0, Math.min(100, myP.n))}%" title="내 점수"></div>` : "";
      return `<div class="row">
        <div class="subj">${badge(d)}<div class="sname"><span>${nameOf(d)}</span><small>${d.cr ? d.cr + "학점" : ""}${d.avg ? ` · 평균 ${esc(d.avg)}` : ""}</small></div></div>
        <div class="acts">${d.weak ? `<button class="icon" type="button" data-est="${esc(d.id)}" aria-pressed="${!d.hiddenEst}">${d.hiddenEst ? "추정 컷 보기" : "추정 숨기기"}</button>` : ""}</div>
        ${d.weak ? `<p class="weaknote">${d.hiddenEst ? "정보가 적어서 2~4컷 추정·석차·분포는 숨겨 뒀어요. '추정 컷 보기'를 누르면 나오지만 범위가 아주 넓어요." : "정보가 적은 과목이라 추정 컷과 석차의 범위가 아주 넓어요. 참고만 하세요."}</p>` : ""}
        <div class="cuts">${cells}${me}</div>
        <div class="strip" aria-hidden="true"><div class="base"></div>
          <span class="scale" style="left:0">0</span><span class="scale" style="right:0">100</span>${ticks}${dot}</div>
        ${goalHtml(d)}
        ${d.facts?.length ? `<div class="facts">${d.facts.map(f => `<span>${esc(f)}</span>`).join("")}</div>` : ""}
        ${semRow(d)}
        ${chartHtml(d)}
        ${d.note ? `<p class="note">${esc(d.note)}</p>` : ""}
        ${d.at ? `<p class="rowat">컷 업데이트 ${fmt(d.at, true)}</p>` : ""}
      </div>`;
    }).join("");
  }

  function saveScore(id, val) {
    const prev = scores[id] || {};
    const body = prev.g && prev.my === val ? { my: val, g: prev.g } : { my: val };
    if (!val) delete scores[id]; else scores[id] = body;
    $("status").textContent = saveLocal() ? "내 점수를 이 브라우저에 저장했어요." : "이 브라우저에서는 저장이 안 돼요. 새로고침하면 사라져요.";
  }

  // 분포 막대: 누르거나(휴대폰) 마우스를 올리면 아래 줄에 인원 표시
  const showBar = bar => {
    const chart = bar.closest(".chart"); if (!chart) return;
    chart.querySelectorAll(".b.sel").forEach(x => x.classList.remove("sel"));
    bar.classList.add("sel");
    const out = chart.querySelector(".readout");
    out.textContent = bar.dataset.info; out.classList.remove("idle");
  };
  document.addEventListener("mouseover", e => { const b = e.target.closest?.(".plot .b"); if (b) showBar(b); });
  document.addEventListener("click", e => {
    const bar = e.target.closest(".plot .b"); if (bar) { showBar(bar); return; }
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.exam) { current = t.dataset.exam; render(); }
    else if (t.dataset.pick) {
      const n = t.dataset.pick; const cur = sel ? [...sel] : [];
      if (cur.includes(n)) sel = cur.filter(x => x !== n);
      else if (cur.length >= MAXSEL) { $("status").textContent = `선택과목은 최대 ${MAXSEL}개까지 고를 수 있어요.`; return; }
      else sel = [...cur, n];
      picking = true; saveSel(); render();
    }
    else if (t.id === "pickDone") { if (!sel) sel = []; picking = false; saveSel(); render(); }
    else if (t.id === "pickEdit") { picking = true; render(); }
    else if (t.dataset.semmode) { semMode = t.dataset.semmode; try { localStorage.setItem("gradecut-sem-mode", semMode); } catch {} render(); }
    else if (t.dataset.est) { const id = t.dataset.est; showEst = showEst.includes(id) ? showEst.filter(x => x !== id) : [...showEst, id]; saveEst(); render(); }
    else if (t.id === "clear") { $("clearAsk").hidden = false; }
    else if (t.id === "clearNo") { $("clearAsk").hidden = true; }
    else if (t.id === "clearYes") { scores = {}; saveLocal(); $("clearAsk").hidden = true; $("status").textContent = "내 점수를 모두 지웠어요."; render(); }
  });
  // 입력하는 즉시 저장 (칸을 벗어나지 않고 새로고침해도 남도록)
  document.addEventListener("input", e => {
    if (e.target.dataset?.score) saveScore(e.target.dataset.score, e.target.value.trim());
    // 기말 목표 슬라이더(등수/점수): 확률 블록만 바로 다시 그리고, 목표 칸과 저장값도 맞춤
    if (e.target.classList?.contains("semrange")) {
      const mid = docs.find(x => x.id === e.target.dataset.mid); if (!mid) return;
      const rank = e.target.dataset.mode === "rank", v = e.target.value, key = rank ? semrKey(mid) : semKey(mid);
      saveScore(key, v);
      const box = document.querySelector(`[data-score="${key}"]`); if (box) box.value = v;
      const sp = e.target.closest(".sem")?.querySelector(".sp"), m = { ...mid, my: scores[mid.id]?.my || "" }, ps = scores[perfKey(mid)]?.my || "";
      if (sp) sp.outerHTML = rank ? probRankHtml(m, null, parseInt(v), false, ps) : probHtml(m, null, parseFloat(v), false, ps);
    }
  });
  document.addEventListener("change", e => { if (e.target.dataset?.score) saveScore(e.target.dataset.score, e.target.value.trim()); });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList?.contains("myin")) e.target.blur(); });
  document.addEventListener("focusout", e => { if (e.target.classList?.contains("myin")) setTimeout(render, 0); });

  // 개인 점수 가져오기 링크: #s=<base64 JSON>
  if (location.hash.startsWith("#s=")) {
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      if (Array.isArray(data._sel)) { sel = data._sel; saveSel(); delete data._sel; }
      scores = { ...loadLocal(), ...data };
      saveLocal();
      history.replaceState(null, "", location.pathname);
    } catch { scores = loadLocal(); }
  } else scores = loadLocal();
  if (!sel) sel = loadSel();

  // 최근 업데이트: updates.json의 최신 3개. 지난번 방문 이후 새로 생긴 건 NEW (처음 방문이면 표시 안 함)
  const LSEEN = "gradecut-last-seen";
  fetch("updates.json", { cache: "no-store" }).then(r => r.json()).then(u => {
    const items = (u.items || []).slice().sort((a, b) => String(b.at).localeCompare(String(a.at)));
    if (!items.length) return;
    let seen = null; try { seen = localStorage.getItem(LSEEN); } catch {}
    const isNew = it => seen && new Date(it.at) > new Date(seen);
    const fresh = items.filter(isNew).length;
    $("news").innerHTML = `<div class="news-h"><b>최근 업데이트</b>${fresh ? `<span class="new">새 소식 ${fresh}개</span>` : ""}</div>
      <ul>${items.slice(0, 3).map(it => `<li><time>${esc(fmt(it.at, true))}</time><span class="tag ${it.kind === "data" ? "d" : "f"}">${it.kind === "data" ? "등급컷" : "기능"}</span><span class="t">${esc(it.title)}${isNew(it) ? `<em>NEW</em>` : ""}</span></li>`).join("")}</ul>
      <div class="news-f"><a href="updates.html">업데이트 내역 전체 보기 →</a>${u.report_url ? `<a class="report" href="${esc(u.report_url)}" target="_blank" rel="noopener">정보 제보하기</a>` : ""}</div>`;
    $("news").hidden = false;
    try { localStorage.setItem(LSEEN, items[0].at); } catch {}
  }).catch(() => {});

  fetch("cuts.json", { cache: "no-store" }).then(r => r.json()).then(j => {
    docs = j.subjects || [];
    if (j.validation) $("validation").textContent = `계산 방법 검증: 이미 아는 실제 컷 ${j.validation.total}개를 하나씩 숨기고 나머지 정보로 맞혀 봤더니 ${j.validation.coverage}개가 90% 범위 안에 들어왔어요 (평균 오차 ${j.validation.mae}점).` + (j.validation.note ? " " + j.validation.note : "");
    const when = fmt(j.updated);
    $("asof").textContent = when ? `${when} 기준 등급컷` : "등급컷 기준 시각 미정";
    $("updated").textContent = when ? `마지막 업데이트 ${when} (한국 시간)` : "";
    render();
  }).catch(() => {
    $("examTitle").textContent = "등급컷을 불러오지 못했어요";
    $("rows").innerHTML = `<div class="empty">새로고침해 주세요.</div>`;
  });
})();
</script>
</body>
</html>
