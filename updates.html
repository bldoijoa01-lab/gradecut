<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>업데이트 내역 · 등급컷 아카이브</title>
<meta name="description" content="등급컷 아카이브 업데이트 내역">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d43d63'/%3E%3Ctext x='16' y='23' font-size='19' font-family='monospace' font-weight='700' text-anchor='middle' fill='white'%3E1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* index.html과 같은 색·글꼴. 날짜별로 묶은 업데이트 목록 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1b2230; --muted:#667085; --rule:#dfe3ea;
  --omr:#d43d63; --omr-soft:#fbe7ec; --me:#2f6fd6;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1a1f27; --ink:#e6e9ef; --muted:#9aa3b2; --rule:#2c3340;
  --omr:#f06b8b; --omr-soft:#3a1f28; --me:#6fa1ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1a1f27; --ink:#e6e9ef; --muted:#9aa3b2; --rule:#2c3340;
  --omr:#f06b8b; --omr-soft:#3a1f28; --me:#6fa1ff; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
a{color:var(--me)}
.back{font-size:.84rem;font-weight:600;text-decoration:none}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.theme{font:inherit;font-size:.78rem;background:none;border:1px solid var(--rule);color:var(--muted);padding:2px 8px;border-radius:6px;cursor:pointer}
h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--omr)}
.sub{color:var(--muted);font-size:.86rem;margin:4px 0 0}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.84rem;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--omr);border-color:var(--omr);color:#fff}
.chip:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.day{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.day h2{margin:0;font-size:.9rem;padding:10px 16px;border-bottom:2px solid var(--omr);font-variant-numeric:tabular-nums}
.day ol{list-style:none;margin:0;padding:0}
.day li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.day li:last-child{border-bottom:0}
.day time{grid-row:1/3;font:500 .74rem var(--mono);color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.day .t{font-weight:700;font-size:.94rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.day .d{font-size:.84rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.tag{font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag.d{background:var(--omr-soft);color:var(--omr)}
.tag.f{background:rgba(47,111,214,.12);color:var(--me)}
.report{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-size:.86rem}
.report a{color:#fff;background:var(--omr);padding:6px 14px;border-radius:999px;text-decoration:none;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:24px 0;font-size:.9rem}
</style>
<script>
try { const t = localStorage.getItem("gradecut-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<div class="wrap">
  <div class="toprow"><a class="back" href="./">← 등급컷 아카이브로</a><button class="theme" type="button" id="theme" aria-label="화면 테마 바꾸기">화면: 자동</button></div>
  <header>
    <h1>업데이트 <span>내역</span></h1>
    <p class="sub">등급컷이 새로 들어오거나 기능이 바뀔 때마다 여기에 기록해요. 시각은 한국 시간이에요.</p>
  </header>
  <div class="filters" role="group" aria-label="종류">
    <button class="chip" type="button" data-k="all" aria-pressed="true">전체</button>
    <button class="chip" type="button" data-k="data" aria-pressed="false">등급컷</button>
    <button class="chip" type="button" data-k="feature" aria-pressed="false">기능</button>
  </div>
  <section class="report" id="report" hidden><span>알고 있는 컷·평균·점수대 인원이 있으면 알려주세요. 이름은 받지 않아요.</span><a id="reportLink" href="#" target="_blank" rel="noopener">정보 제보하기</a></section>
  <div id="list"><p class="empty">불러오는 중이에요.</p></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const parts = iso => {
    const p = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "numeric", day: "numeric", weekday: "short", hour: "numeric", minute: "2-digit", hour12: true }).formatToParts(new Date(iso));
    const g = t => p.find(x => x.type === t)?.value || "";
    return { day: `${g("month")}월 ${g("day")}일 (${g("weekday")})`, key: `${g("year")}-${g("month")}-${g("day")}`, time: `${g("dayPeriod")} ${g("hour")}:${g("minute")}` };
  };
  let items = [], kind = "all";
  function render() {
    const list = items.filter(it => kind === "all" || it.kind === kind);
    if (!list.length) { $("list").innerHTML = `<p class="empty">아직 기록이 없어요.</p>`; return; }
    const days = [];
    for (const it of list) {
      const p = parts(it.at);
      if (!days.length || days[days.length - 1].key !== p.key) days.push({ key: p.key, label: p.day, rows: [] });
      days[days.length - 1].rows.push({ ...it, time: p.time });
    }
    $("list").innerHTML = days.map(d => `<section class="day"><h2>${esc(d.label)}</h2><ol>${d.rows.map(it =>
      `<li><time>${esc(it.time)}</time><span class="t"><span class="tag ${it.kind === "data" ? "d" : "f"}">${it.kind === "data" ? "등급컷" : "기능"}</span>${esc(it.title)}</span>${it.detail ? `<p class="d">${esc(it.detail)}</p>` : ""}</li>`).join("")}</ol></section>`).join("");
  }
  // 화면 테마 (메인과 같은 설정을 씀)
  let theme = (() => { try { const t = localStorage.getItem("gradecut-theme"); return t === "light" || t === "dark" ? t : "auto"; } catch { return "auto"; } })();
  const setTheme = t => {
    theme = t;
    if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
    try { if (t === "auto") localStorage.removeItem("gradecut-theme"); else localStorage.setItem("gradecut-theme", t); } catch {}
    $("theme").textContent = "화면: " + { auto: "자동", light: "라이트", dark: "다크" }[t];
  };
  setTheme(theme);
  $("theme").addEventListener("click", () => { const o = ["auto", "light", "dark"]; setTheme(o[(o.indexOf(theme) + 1) % 3]); });
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-k]"); if (!b) return;
    kind = b.dataset.k;
    document.querySelectorAll("[data-k]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });
  fetch("updates.json", { cache: "no-store" }).then(r => r.json()).then(u => {
    items = (u.items || []).slice().sort((a, b) => String(b.at).localeCompare(String(a.at)));
    if (u.report_url) { $("reportLink").href = u.report_url; $("report").hidden = false; }
    render();
  }).catch(() => { $("list").innerHTML = `<p class="empty">내역을 불러오지 못했어요. 새로고침해 주세요.</p>`; });
})();
</script>
</body>
</html>
